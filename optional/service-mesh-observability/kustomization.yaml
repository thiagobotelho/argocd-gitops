apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../service-mesh-kiali
patches:
- target:
    kind: Application
    name: service-mesh
  patch: |-
    - op: replace
      path: /spec/source/path
      value: optional/observability
- target:
    kind: AppProject
    name: service-mesh
  patch: |-
    - op: add
      path: /spec/clusterResourceWhitelist/-
      value:
        group: rbac.authorization.k8s.io
        kind: ClusterRole
    - op: add
      path: /spec/clusterResourceWhitelist/-
      value:
        group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
    - op: add
      path: /spec/namespaceResourceWhitelist/-
      value:
        group: telemetry.istio.io
        kind: Telemetry
    - op: add
      path: /spec/namespaceResourceWhitelist/-
      value:
        group: monitoring.rhobs
        kind: PrometheusRule
