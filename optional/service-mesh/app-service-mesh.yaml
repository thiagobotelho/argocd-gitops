apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-mesh
  # Namespace da Application no Argo CD.
  namespace: openshift-gitops
spec:
  project: service-mesh
  source:
    repoURL: https://github.com/thiagobotelho/service-mesh-gitops.git
    targetRevision: main
    path: overlays/desenvolvimento
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # Reconcilia a infraestrutura automaticamente, sem excluir recursos removidos do Git.
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
    - PruneLast=true
