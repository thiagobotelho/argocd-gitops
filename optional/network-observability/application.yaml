# Opt-in: não faz parte do App-of-Apps padrão por consumir recursos adicionais.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-observability
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/thiagobotelho/network-observability-gitops.git
    targetRevision: main
    path: overlays/desenvolvimento
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-netobserv-operator
  # Revisar autosync e prune: sincronização e exclusão são decisões distintas.
  # Revisar autosync e prune: sincronização e exclusão são decisões distintas.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, PruneLast=true]
