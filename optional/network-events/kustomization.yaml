# Reutiliza a mesma Application; não cria outro FlowCollector.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../network-observability
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: network-observability
    patch: |-
      - op: replace
        path: /spec/source/path
        value: overlays/desenvolvimento-network-events
