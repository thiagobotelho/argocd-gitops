apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/thiagobotelho/argocd-gitops.git
    targetRevision: main
    path: overlays/applications/desenvolvimento
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  # Revisar autosync e prune: sincronização e exclusão são decisões distintas.
  # Revisar autosync e prune: sincronização e exclusão são decisões distintas.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
