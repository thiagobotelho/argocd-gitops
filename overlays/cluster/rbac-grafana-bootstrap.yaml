# Acesso de bootstrap para o laboratório com OpenShift OAuth/Dex.
# Mantém os grupos administrativos e permite somente Sync do Grafana ao kubeadmin.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  rbac:
    defaultPolicy: 'role:readonly'
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      p, kubeadmin, applications, sync, default/grafana, allow
    # O conector OpenShift preenche email com o nome do usuário.
    scopes: '[groups, email]'
