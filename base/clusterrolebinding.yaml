# Bootstrap de plataforma: este vínculo permite gerenciar recursos globais.
# O AppProject do mesh restringe suas operações, mas não substitui RBAC Kubernetes.
# Reduzir este papel exige inventário de todas as Applications e validação de bootstrap.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: openshift-gitops-application-controller
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/tracking-id: >-
      argocd-cluster:rbac.authorization.k8s.io/ClusterRoleBinding:openshift-gitops/openshift-gitops-application-controller
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin


