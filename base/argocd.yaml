apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  name: openshift-gitops
  namespace: openshift-gitops
  finalizers:
    - argoproj.io/finalizer
  labels:
    argocd.argoproj.io/instance: argocd-cluster
spec:
  resourceHealthChecks:
    - group: flows.netobserv.io
      kind: FlowCollector
      check: |
        hs = {status = "Progressing", message = "Waiting for current status conditions"}
        if obj.status == nil then return hs end
        if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then return hs end
        if obj.status.conditions == nil then return hs end
        for _, c in ipairs(obj.status.conditions) do
          if (c.type == "Degraded" and c.status == "True") or (c.type == "Ready" and c.status == "False") then
            hs.status = "Degraded"
            hs.message = c.message or c.reason or "Resource is not ready"
            return hs
          end
        end
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = c.message or c.reason or "Ready"
            return hs
          end
        end
        return hs
    - group: loki.grafana.com
      kind: LokiStack
      check: |
        hs = {status = "Progressing", message = "Waiting for current status conditions"}
        if obj.status == nil then return hs end
        if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then return hs end
        if obj.status.conditions == nil then return hs end
        for _, c in ipairs(obj.status.conditions) do
          if (c.type == "Degraded" and c.status == "True") or (c.type == "Ready" and c.status == "False") then
            hs.status = "Degraded"
            hs.message = c.message or c.reason or "Resource is not ready"
            return hs
          end
        end
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = c.message or c.reason or "Ready"
            return hs
          end
        end
        return hs
    - group: sailoperator.io
      kind: Istio
      check: |
        local hs = {status = "Progressing", message = "Aguardando reconciliação"}
        if obj.status == nil then return hs end
        if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then return hs end
        if obj.status.state == "Healthy" then
          return {status = "Healthy", message = "Recurso do Mesh saudável"}
        end
        for _, c in ipairs(obj.status.conditions or {}) do
          if c.type == "Reconciled" and c.status == "False" then
            return {status = "Degraded", message = c.message or c.reason or "Falha de reconciliação"}
          end
        end
        if obj.status.state == "Failed" or obj.status.state == "Error" or obj.status.state == "NameAlreadyExists" then
          return {status = "Degraded", message = obj.status.state}
        end
        return hs
    - group: sailoperator.io
      kind: IstioCNI
      check: |
        local hs = {status = "Progressing", message = "Aguardando reconciliação"}
        if obj.status == nil then return hs end
        if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then return hs end
        if obj.status.state == "Healthy" then
          return {status = "Healthy", message = "Recurso do Mesh saudável"}
        end
        for _, c in ipairs(obj.status.conditions or {}) do
          if c.type == "Reconciled" and c.status == "False" then
            return {status = "Degraded", message = c.message or c.reason or "Falha de reconciliação"}
          end
        end
        if obj.status.state == "Failed" or obj.status.state == "Error" or obj.status.state == "NameAlreadyExists" then
          return {status = "Degraded", message = obj.status.state}
        end
        return hs
    - group: sailoperator.io
      kind: IstioRevisionTag
      check: |
        local hs = {status = "Progressing", message = "Aguardando reconciliação"}
        if obj.status == nil then return hs end
        if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then return hs end
        if obj.status.state == "Healthy" then
          return {status = "Healthy", message = "Recurso do Mesh saudável"}
        end
        for _, c in ipairs(obj.status.conditions or {}) do
          if c.type == "Reconciled" and c.status == "False" then
            return {status = "Degraded", message = c.message or c.reason or "Falha de reconciliação"}
          end
        end
        if obj.status.state == "Failed" or obj.status.state == "Error" or obj.status.state == "NameAlreadyExists" then
          return {status = "Degraded", message = obj.status.state}
        end
        return hs
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: '1'
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    route:
      enabled: true
    service:
      type: ''
  grafana:
    enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: false
  monitoring:
    enabled: true
  notifications:
    enabled: true
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  initialSSHKnownHosts: {}
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    provider: dex
  applicationInstanceLabelKey: argocd.argoproj.io/instance
  applicationSet:
    resources:
      limits:
        cpu: '2'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  rbac:
    defaultPolicy: 'role:readonly'
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: '[groups]'
  repo:
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  resourceExclusions: |
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun
      - PipelineRun
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  tls:
    ca: {}
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  controller:
    processors: {}
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}
