apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/thiagobotelho/keycloak-gitops.git
    targetRevision: main
    path: overlays/desenvolvimento
  destination:
    server: https://kubernetes.default.svc
    # Namespace deste objeto; não confundir com seleção de namespaces de origem.
    # Namespace deste objeto; não confundir com seleção de namespaces de origem.
    namespace: keycloak-dev
  # Revisar autosync e prune: sincronização e exclusão são decisões distintas.
  # Revisar autosync e prune: sincronização e exclusão são decisões distintas.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
