# Bootstrap de autorização OIDC. Aplicar após criar os seis namespaces.
# Membros são geridos no Keycloak e sincronizados pelo OAuth no login.
# RoleBinding limita o ClusterRole ao namespace, sem permissão global.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-viewers
  namespace: grafana
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: openshift-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-project-admins
  namespace: grafana
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: openshift-project-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
